name: MMIPS release foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-foundation-verify:
    name: release-foundation-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup selected Node 22 LTS runtime
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Clean install from package-lock.json
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests for compiled production modules
        run: npm run test:unit
      - name: Static source checks
        run: npm run test:static
      - name: Authorization and rendering contract checks
        run: npm run test:contract
      - name: Security unit and contract tests
        run: npm run test:security
      - name: United States production build
        run: npm run build
      - name: Global gateway production build without country database credentials
        env:
          MMIPS_SITE_MODE: global
          NEXT_PUBLIC_SITE_URL: https://mmips.com
          NEXT_PUBLIC_US_SITE_URL: https://us.mmips.com
        run: |
          rm -rf .next
          npm run build
      - name: Canada prelaunch production build without United States database credentials
        env:
          MMIPS_SITE_MODE: ca
          NEXT_PUBLIC_SITE_URL: https://ca.mmips.com
          NEXT_PUBLIC_GLOBAL_SITE_URL: https://mmips.com
        run: |
          rm -rf .next
          npm run build
      - name: Public smoke checks without browser automation
        run: npm run test:smoke
      - name: Static accessibility baseline checks
        run: npm run test:accessibility:baseline
      - name: Secret-pattern scan
        run: npm run security:secrets
      - name: Online dependency audit
        run: npm run security:audit
      - name: Upload safe failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-foundation-failure-artifacts
          path: |
            .next/diagnostics/**
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 7
